name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
        # Com pyarrow instalado o pandas usa strings Arrow. pyarrow: [false] na matriz faz o
        # include abaixo virar um 5º job, em vez de se fundir ao ubuntu/3.14 existente.
        pyarrow: [false]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            pyarrow: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: python -m pip install -e ".[pandas,dev]"
      - name: Instalar pyarrow e confirmar que o pandas usa strings Arrow
        if: matrix.pyarrow
        run: |
          python -m pip install pyarrow
          python -c "import pandas as pd; s = pd.Series(['a'], dtype='str'); assert s.dtype.storage == 'pyarrow', s.dtype.storage"
      - name: Lint e formatação
        run: |
          python -m ruff check src tests tools
          python -m ruff format --check src tests tools
      - name: Tipos
        run: python -m mypy
      - name: Testes
        run: python -m pytest --cov=reconcile --cov-report=term-missing
