[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconcile"
version = "0.1.0"
description = "Conciliação de pedidos entre extratos CSV de ERP e CRM, com dois motores equivalentes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=3.0"]
dev = ["pytest>=8", "hypothesis>=6.100", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
reconcile = "reconcile.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reconcile"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
